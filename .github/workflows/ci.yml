name: CI Pipeline

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, review_requested]
    branches:
      - develop
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: pytest --junitxml=report.xml --cov=src --cov-report=xml --cov-report=term

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            report.xml
            coverage.xml

  analysis:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Перевірка цільової гілки PR
        uses: actions/github-script@v7
        with:
          script: |
            const base = context.payload.pull_request.base.ref;
            const head = context.payload.pull_request.head.ref;
            console.log(`Pull request: ${head} -> ${base}`);
            if (base !== 'develop') {
              core.setFailed(`PR має бути спрямований у develop, а не у ${base}`);
            }

      - name: Code Review Check for develop
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            console.log(`Знайдено рев'ю для PR #${prNumber}: ${reviews.length}`);
            for (const review of reviews) {
              console.log(`- ${review.user.login}: ${review.state} (${review.submitted_at}) ${review.body || ''}`);
            }
            const approved = reviews.some(review => review.state === 'APPROVED');
            if (!approved) {
              core.setFailed("Код-рев'ю не схвалено");
            } else {
              console.log("Код-рев'ю схвалено");
            }

      - name: Count lines of code with Cloc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cloc
          cloc src/ tests/ > cloc-report.txt
          cat cloc-report.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Запуск flake8 через Reviewdog
        uses: reviewdog/action-flake8@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          level: error
          fail_level: error

      - name: Запуск Black через Reviewdog
        uses: reviewdog/action-black@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          level: info

      - name: Download test reports
        uses: actions/download-artifact@v4
        with:
          name: test-reports

      - name: Run SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          wget -q https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-7.2.0.5079-linux-x64.zip
          unzip -q sonar-scanner-cli-7.2.0.5079-linux-x64.zip
          export PATH=$PATH:$(pwd)/sonar-scanner-7.2.0.5079-linux-x64/bin
          sonar-scanner

      - name: Перевірка змін у гілці develop
        run: |
          git checkout develop
          git pull
          git log --oneline --graph > develop_changes.txt
          cat develop_changes.txt

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-reports
          path: |
            cloc-report.txt
            develop_changes.txt